[workspace]
members = ["crates/minha-core", "crates/minha-tui", "crates/minha-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/bybrooklyn/minha"
description = "A fast, token-conscious multi-agent coding harness for ChatGPT Codex"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
crossterm = "0.29.0"
dirs = "6.0.0"
futures-util = "0.3.31"
parking_lot = "0.12.5"
portable-pty = "0.9.0"
rand = "0.9.2"
ratatui = "0.30.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7.4.0"
rusqlite = { version = "0.38.0", features = ["bundled", "chrono", "uuid"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.24.0"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
toml = "0.9.8"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.19.0", features = ["v4", "v7", "serde"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"
vt100 = "0.16.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
